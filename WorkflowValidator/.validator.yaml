# Example .validator.yaml configuration
# Place this file in your workflow directory

# Workflow configuration
workflow:
  # Path to the generator script (relative to this file)
  generator: generate_workflow.py

  # Working directory for path resolution (relative to this file, or absolute)
  directory: .

  # Default arguments for the generator
  default_args: production --workers=4

  # Validation level
  validation_level: standard

  # Output format
  output_format: terminal

# Optional: transformation catalog and replica catalog
catalogs:
  transformation_catalog: null
  replica_catalog: null
