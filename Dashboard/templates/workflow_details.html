<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAPE-K Pipeline - Workflow Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: var(--gray-800);
        }

        /* Header */
        .header {
            background: white;
            border-bottom: 1px solid var(--gray-200);
            padding: 24px 40px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            padding: 10px 16px;
            background: white;
            border: 1px solid var(--gray-300);
            border-radius: 8px;
            color: var(--gray-700);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--gray-100);
        }

        .workflow-header-info h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .workflow-id {
            font-family: Monaco, monospace;
            font-size: 13px;
            color: var(--gray-600);
        }

        .refresh-btn {
            padding: 10px 20px;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 40px;
        }

        /* MAPE-K Pipeline Steps */
        .pipeline-steps {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .pipeline-step {
            background: white;
            border-radius: 12px;
            border: 1px solid var(--gray-200);
            overflow: hidden;
            transition: all 0.3s;
        }

        .pipeline-step.completed {
            border-color: var(--success);
        }

        .pipeline-step.error {
            border-color: var(--danger);
        }

        .pipeline-step.in-progress {
            border-color: var(--primary);
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0%, 100% { border-color: var(--primary); }
            50% { border-color: rgba(99, 102, 241, 0.3); }
        }

        .step-header {
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .step-header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .step-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .step-icon.monitor { background: rgba(59, 130, 246, 0.1); }
        .step-icon.analyzer { background: rgba(139, 92, 246, 0.1); }
        .step-icon.planner { background: rgba(16, 185, 129, 0.1); }
        .step-icon.executor { background: rgba(245, 158, 11, 0.1); }

        .step-info h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .step-description {
            font-size: 14px;
            color: var(--gray-500);
        }

        .step-status {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-badge.completed {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .status-badge.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .status-badge.pending {
            background: rgba(148, 163, 184, 0.1);
            color: var(--gray-500);
        }

        .status-badge.in-progress {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
        }

        .expand-icon {
            font-size: 20px;
            transition: transform 0.3s;
        }

        .step-content {
            padding: 0 24px 24px 24px;
            display: none;
        }

        .step-content.expanded {
            display: block;
            animation: slideDown 0.3s;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Output Sections */
        .output-section {
            margin-bottom: 20px;
        }

        .output-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .output-box {
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            padding: 16px;
            font-size: 13px;
        }

        .output-box pre {
            margin: 0;
            font-family: Monaco, monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .key-value-list {
            display: grid;
            gap: 12px;
        }

        .key-value-item {
            display: flex;
            gap: 12px;
        }

        .key-value-key {
            font-weight: 600;
            color: var(--gray-600);
            min-width: 150px;
        }

        .key-value-value {
            color: var(--gray-900);
            font-family: Monaco, monospace;
            font-size: 12px;
        }

        /* Problems List */
        .problems-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .problem-item {
            background: white;
            border: 1px solid var(--gray-200);
            border-left: 4px solid var(--danger);
            border-radius: 8px;
            padding: 16px;
        }

        .problem-title {
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 8px;
        }

        .problem-description {
            color: var(--gray-700);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .problem-solution {
            background: rgba(16, 185, 129, 0.05);
            border-left: 3px solid var(--success);
            padding: 12px;
            border-radius: 6px;
        }

        .solution-label {
            font-weight: 600;
            color: var(--success);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Plans List */
        .plans-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .plan-item {
            background: white;
            border: 1px solid var(--gray-200);
            border-left: 4px solid var(--success);
            border-radius: 8px;
            padding: 16px;
        }

        .plan-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .plan-title {
            font-weight: 600;
            color: var(--gray-900);
        }

        .risk-badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .risk-badge.low { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .risk-badge.medium { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .risk-badge.high { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

        .plan-steps {
            margin-top: 12px;
            padding-left: 20px;
        }

        .plan-steps li {
            margin-bottom: 8px;
            color: var(--gray-700);
        }

        /* Loading/Empty */
        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid var(--gray-200);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <!-- Configuration -->
    <script src="/static/config.js"></script>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <div style="display: flex; align-items: center; gap: 20px;">
                <a href="/" class="back-btn">← Back</a>
                <div class="workflow-header-info">
                    <h1>MAPE-K Pipeline Analysis</h1>
                    <div class="workflow-id" id="workflow-id-display">Loading...</div>
                </div>
            </div>
            <div style="display: flex; gap: 12px;">
                <button class="refresh-btn" onclick="rerunWorkflow()" style="background: #f59e0b; border: none; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px;">
                    🔄 Rerun Workflow
                </button>
                <button class="refresh-btn" onclick="loadWorkflowData()">🔄 Refresh</button>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Workflow Statistics Cards -->
        <div style="background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 24px;" id="workflow-stats-section">
            <h2 style="margin: 0 0 20px 0; font-size: 20px; color: var(--gray-900);">📊 Workflow Statistics</h2>
            <div id="workflow-stats-cards">
                <div style="text-align: center; padding: 40px; color: var(--gray-400);">
                    Loading workflow statistics...
                </div>
            </div>
        </div>

        <!-- Workflow DAG Visualization -->
        <div style="background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 24px;" id="workflow-dag-section">
            <h2 style="margin: 0 0 20px 0; font-size: 20px; color: var(--gray-900);">🔀 Workflow DAG</h2>
            <div id="workflow-dag-content">
                <div style="text-align: center; padding: 40px; color: var(--gray-400);">
                    Loading workflow structure...
                </div>
            </div>
        </div>

        <div class="pipeline-steps" id="pipeline-steps">
            <div class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 16px; color: var(--gray-500);">Loading MAPE-K pipeline...</p>
            </div>
        </div>
    </div>

    <script>
        // Get workflow ID from URL
        const workflowId = window.location.pathname.split('/').pop();

        // Load data on page load
        loadWorkflowData();
        loadWorkflowDAG();

        // Auto-refresh every 15 seconds
        setInterval(() => {
            loadWorkflowData();
            loadWorkflowDAG();
        }, 15000);

        async function loadWorkflowData() {
            try {
                document.getElementById('workflow-id-display').textContent = workflowId;

                console.log('🔍 Loading workflow data for:', workflowId);

                // Fetch both dashboard analysis AND Pegasus real-time data in parallel
                console.log('📡 Fetching dashboard analysis...');
                console.log('📡 Fetching Pegasus data...');

                const [dashboardResponse, pegasusResponse] = await Promise.all([
                    fetch(`/api/workflow/${workflowId}/analysis`),
                    fetch(`${CONFIG.PEGASUS_PROVIDER_URL}/api/workflows/${workflowId}/full`)
                ]);

                console.log('✅ Dashboard response status:', dashboardResponse.status);
                console.log('✅ Pegasus response status:', pegasusResponse.status);

                const data = await dashboardResponse.json();
                console.log('📊 Dashboard data:', data);

                let pegasusData = null;

                if (pegasusResponse.ok) {
                    try {
                        // First get the raw text to see what we're receiving
                        const pegasusText = await pegasusResponse.text();
                        console.log('📄 Raw Pegasus response (first 500 chars):', pegasusText.substring(0, 500));

                        // Try to parse it as JSON
                        pegasusData = JSON.parse(pegasusText);
                        console.log('📊 Pegasus real-time data loaded:', pegasusData);
                    } catch (parseError) {
                        console.error('❌ Failed to parse Pegasus response as JSON:', parseError);
                        console.error('Response was:', await pegasusResponse.clone().text());
                    }
                } else {
                    console.warn('⚠️ Pegasus Provider not available or workflow not found');
                    const pegasusError = await pegasusResponse.text();
                    console.warn('Pegasus error:', pegasusError);
                }

                console.log('🎨 Rendering stats cards...');
                renderWorkflowStats(pegasusData);
                console.log('✅ Stats cards rendered');

                console.log('🎨 Rendering pipeline...');
                renderPipeline(data, pegasusData);
                console.log('✅ Pipeline rendered successfully');

            } catch (error) {
                console.error('❌ Error loading workflow data:', error);
                console.error('Error details:', error.message);
                console.error('Stack trace:', error.stack);

                document.getElementById('pipeline-steps').innerHTML = `
                    <div style="text-align: center; padding: 40px; color: var(--danger);">
                        <h3>Error loading workflow data</h3>
                        <p style="margin: 20px 0;">Check browser console (F12) for details</p>
                        <details style="text-align: left; max-width: 600px; margin: 20px auto; background: #f5f5f5; padding: 15px; border-radius: 8px;">
                            <summary style="cursor: pointer; font-weight: bold;">Error Details</summary>
                            <pre style="margin-top: 10px; white-space: pre-wrap;">${error.message}\n\n${error.stack}</pre>
                        </details>
                        <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer;">
                            Retry
                        </button>
                    </div>
                `;
            }
        }

        // Rerun workflow
        async function rerunWorkflow() {
            // Show confirmation dialog
            const confirmed = confirm(
                `⚠️ Rerun Workflow?\n\n` +
                `This will execute: pegasus-run <workflow-dir>\n\n` +
                `Workflow ID: ${workflowId}\n\n` +
                `Are you sure you want to rerun this workflow?`
            );

            if (!confirmed) {
                return;
            }

            try {
                // Show loading state
                const button = event.target;
                const originalText = button.innerHTML;
                button.disabled = true;
                button.innerHTML = '⏳ Rerunning...';

                console.log('🔄 Rerunning workflow:', workflowId);

                const response = await fetch(`${CONFIG.PEGASUS_PROVIDER_URL}/api/workflows/${workflowId}/rerun`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                // Reset button
                button.disabled = false;
                button.innerHTML = originalText;

                if (result.success) {
                    alert(
                        `✅ Workflow Rerun Started!\n\n` +
                        `Workflow ID: ${workflowId}\n` +
                        `Submit Dir: ${result.submit_dir}\n\n` +
                        `Output:\n${result.stdout || 'No output'}`
                    );
                    console.log('✅ Workflow rerun successful:', result);

                    // Refresh the page after a short delay
                    setTimeout(() => {
                        loadWorkflowData();
                        loadWorkflowDAG();
                    }, 2000);
                } else {
                    alert(
                        `❌ Workflow Rerun Failed\n\n` +
                        `Error: ${result.error}\n\n` +
                        `${result.stderr || ''}`
                    );
                    console.error('❌ Workflow rerun failed:', result);
                }

            } catch (error) {
                console.error('❌ Error rerunning workflow:', error);
                alert(`❌ Error: ${error.message}`);

                // Reset button on error
                const button = event.target;
                button.disabled = false;
                button.innerHTML = '🔄 Rerun Workflow';
            }
        }

        // Load and render workflow DAG
        async function loadWorkflowDAG() {
            try {
                // Fetch both jobs and full workflow data for DAG construction
                const [jobsResponse, fullResponse] = await Promise.all([
                    fetch(`${CONFIG.PEGASUS_PROVIDER_URL}/api/workflows/${workflowId}/jobs`),
                    fetch(`${CONFIG.PEGASUS_PROVIDER_URL}/api/workflows/${workflowId}/full`)
                ]);

                if (!jobsResponse.ok && !fullResponse.ok) {
                    console.warn('Could not load workflow data');
                    document.getElementById('workflow-dag-content').innerHTML = `
                        <div style="text-align: center; padding: 20px; color: var(--gray-400);">
                            Workflow structure not available
                        </div>
                    `;
                    return;
                }

                const jobsData = jobsResponse.ok ? await jobsResponse.json() : null;
                const fullData = fullResponse.ok ? await fullResponse.json() : null;

                const jobs = jobsData?.jobs || fullData?.jobs || [];
                const workflowYaml = fullData?.workflow_yaml || null;

                if (jobs.length > 0) {
                    renderWorkflowDAGGraph(jobs, workflowYaml);
                } else {
                    document.getElementById('workflow-dag-content').innerHTML = `
                        <div style="text-align: center; padding: 20px; color: var(--gray-400);">
                            No job data available
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading workflow DAG:', error);
                document.getElementById('workflow-dag-content').innerHTML = `
                    <div style="text-align: center; padding: 20px; color: var(--gray-400);">
                        Error loading workflow structure
                    </div>
                `;
            }
        }

        function renderWorkflowDAGGraph(jobs, workflowYaml) {
            const container = document.getElementById('workflow-dag-content');

            // Create container for graph and toggle
            container.innerHTML = `
                <div style="margin-bottom: 16px; display: flex; gap: 12px; align-items: center;">
                    <button id="dag-view-graph" onclick="switchDAGView('graph')" style="padding: 8px 16px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px;">
                        📊 Graph View
                    </button>
                    <button id="dag-view-summary" onclick="switchDAGView('summary')" style="padding: 8px 16px; background: white; color: var(--gray-700); border: 1px solid var(--gray-300); border-radius: 6px; cursor: pointer; font-size: 14px;">
                        📋 Summary View
                    </button>
                </div>
                <div id="dag-graph-container" style="width: 100%; height: 500px; border: 1px solid #e5e7eb; border-radius: 8px;"></div>
                <div id="dag-summary-container" style="display: none;"></div>
            `;

            // Render initial graph view
            renderDAGGraph(jobs);

            // Store jobs for view switching
            window._workflowJobs = jobs;
        }

        function switchDAGView(view) {
            const graphBtn = document.getElementById('dag-view-graph');
            const summaryBtn = document.getElementById('dag-view-summary');
            const graphContainer = document.getElementById('dag-graph-container');
            const summaryContainer = document.getElementById('dag-summary-container');

            if (view === 'graph') {
                graphBtn.style.background = 'var(--primary)';
                graphBtn.style.color = 'white';
                summaryBtn.style.background = 'white';
                summaryBtn.style.color = 'var(--gray-700)';
                graphContainer.style.display = 'block';
                summaryContainer.style.display = 'none';
                renderDAGGraph(window._workflowJobs);
            } else {
                graphBtn.style.background = 'white';
                graphBtn.style.color = 'var(--gray-700)';
                summaryBtn.style.background = 'var(--primary)';
                summaryBtn.style.color = 'white';
                graphContainer.style.display = 'none';
                summaryContainer.style.display = 'block';
                renderDAGSummary(window._workflowJobs);
            }
        }

        function renderDAGGraph(jobs) {
            if (!jobs || jobs.length === 0) return;

            const container = document.getElementById('dag-graph-container');

            // Create nodes and edges from jobs
            const nodes = [];
            const edges = [];

            // Color mapping by job state
            const stateColors = {
                'success': '#10b981',
                'running': '#3b82f6',
                'failed': '#ef4444',
                'held': '#f59e0b',
                'queued': '#8b5cf6',
                'ready': '#06b6d4',
                'unsubmitted': '#6b7280',
                'other': '#9ca3af'
            };

            // Build nodes
            jobs.forEach(job => {
                const state = job.state || 'other';
                const color = stateColors[state] || stateColors['other'];
                const label = job.name || job.exec_job_id || 'Unknown';

                nodes.push({
                    id: job.exec_job_id || job.name,
                    label: label.length > 20 ? label.substring(0, 17) + '...' : label,
                    title: `Job: ${label}\nState: ${state}\nType: ${job.type_desc || 'N/A'}`,
                    color: {
                        background: color,
                        border: color,
                        highlight: {
                            background: color,
                            border: '#000'
                        }
                    },
                    font: {
                        color: '#ffffff',
                        size: 12
                    },
                    shape: 'box',
                    margin: 10
                });
            });

            // Build edges from parent dependencies
            jobs.forEach(job => {
                if (job.parents && Array.isArray(job.parents)) {
                    job.parents.forEach(parentId => {
                        edges.push({
                            from: parentId,
                            to: job.exec_job_id || job.name,
                            arrows: 'to',
                            color: { color: '#94a3b8', highlight: '#475569' },
                            width: 2
                        });
                    });
                }
            });

            // If no edges found, try to infer from job dependencies
            if (edges.length === 0) {
                // Simple fallback: link jobs sequentially if they have dependencies
                console.log('No explicit parent relationships found, using simple layout');
            }

            // Create vis-network graph
            const data = {
                nodes: new vis.DataSet(nodes),
                edges: new vis.DataSet(edges)
            };

            const options = {
                layout: {
                    hierarchical: {
                        enabled: true,
                        direction: 'UD',  // Up to Down
                        sortMethod: 'directed',
                        nodeSpacing: 150,
                        levelSeparation: 100
                    }
                },
                physics: {
                    enabled: false
                },
                interaction: {
                    hover: true,
                    tooltipDelay: 100,
                    zoomView: true,
                    dragView: true
                },
                nodes: {
                    borderWidth: 2,
                    borderWidthSelected: 3
                },
                edges: {
                    smooth: {
                        type: 'cubicBezier',
                        forceDirection: 'vertical'
                    }
                }
            };

            try {
                const network = new vis.Network(container, data, options);

                // Add click handler
                network.on('click', function(params) {
                    if (params.nodes.length > 0) {
                        const nodeId = params.nodes[0];
                        const job = jobs.find(j => (j.exec_job_id || j.name) === nodeId);
                        if (job) {
                            alert(`Job: ${job.name}\nState: ${job.state}\nType: ${job.type_desc || 'N/A'}\nDuration: ${job.duration || 'N/A'}`);
                        }
                    }
                });
            } catch (error) {
                console.error('Error creating DAG graph:', error);
                container.innerHTML = `<div style="padding: 40px; text-align: center; color: var(--danger);">Error rendering graph: ${error.message}</div>`;
            }
        }

        function renderDAGSummary(jobs) {
            // Group jobs by state
            const jobsByState = {
                'success': [],
                'running': [],
                'failed': [],
                'held': [],
                'queued': [],
                'ready': [],
                'unsubmitted': [],
                'other': []
            };

            jobs.forEach(job => {
                const state = job.state || 'other';
                if (jobsByState[state]) {
                    jobsByState[state].push(job);
                } else {

        function renderWorkflowStats(pegasusData) {
            const container = document.getElementById('workflow-stats-cards');

            if (!pegasusData || !pegasusData.statistics) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: var(--gray-400);">

                    </div>
                `;
                return;
            }

            const stats = pegasusData.statistics || {};
            const status = pegasusData.status?.status || {};
            const jobs = pegasusData.jobs || [];

            // Calculate job statistics
            const totalJobs = jobs.length;
            const successJobs = jobs.filter(j => j.state === 'success').length;
            const failedJobs = jobs.filter(j => j.state === 'failed').length;
            const runningJobs = jobs.filter(j => j.state === 'running').length;
            const successRate = totalJobs > 0 ? ((successJobs / totalJobs) * 100).toFixed(1) : 0;

            // Calculate duration
            const duration = stats.total_duration || status.duration || 'N/A';
            const durationFormatted = typeof duration === 'number' ?
                (duration > 3600 ? `${(duration/3600).toFixed(1)}h` :
                 duration > 60 ? `${(duration/60).toFixed(1)}m` :
                 `${duration}s`) : duration;

            // Get workflow state
            const workflowState = status.state || stats.status || 'Unknown';
            const stateColor = {
                'Success': '#10b981',
                'Running': '#3b82f6',
                'Failed': '#ef4444',
                'Held': '#f59e0b',
                'Unknown': '#6b7280'
            }[workflowState] || '#6b7280';

            // Render stats cards
            const html = `
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
                    <!-- Total Jobs Card -->
                    <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; border-radius: 12px; color: white;">

                        <div style="font-size: 14px; opacity: 0.9; margin-bottom: 8px;">✅ Success Rate</div>
                        <div style="font-size: 32px; font-weight: 700;">${successRate}%</div>
                        <div style="font-size: 12px; opacity: 0.8; margin-top: 4px;">
                            ${successJobs} / ${totalJobs} jobs
                        </div>
                    </div>

                    <!-- Failed Jobs Card -->
                    <div style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); padding: 20px; border-radius: 12px; color: white;">
                        <div style="font-size: 14px; opacity: 0.9; margin-bottom: 8px;">❌ Failed Jobs</div>
                        <div style="font-size: 32px; font-weight: 700;">${failedJobs}</div>
                        <div style="font-size: 12px; opacity: 0.8; margin-top: 4px;">
                            ${failedJobs > 0 ? 'Need attention' : 'None failed'}
                        </div>
                    </div>

                    <!-- Duration Card -->
                    <div style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); padding: 20px; border-radius: 12px; color: white;">
                        <div style="font-size: 14px; opacity: 0.9; margin-bottom: 8px;">⏱️ Duration</div>
                        <div style="font-size: 32px; font-weight: 700;">${durationFormatted}</div>
                        <div style="font-size: 12px; opacity: 0.8; margin-top: 4px;">
                            Execution time

                    </div>

                    <!-- Workflow State Card -->
                    <div style="background: linear-gradient(135deg, ${stateColor} 0%, ${stateColor}dd 100%); padding: 20px; border-radius: 12px; color: white;">
                        <div style="font-size: 14px; opacity: 0.9; margin-bottom: 8px;">🔄 State</div>
                        <div style="font-size: 28px; font-weight: 700; text-transform: capitalize;">${workflowState}</div>

                        <div style="font-size: 12px; opacity: 0.8; margin-top: 4px;">
                            Workflow tasks
                        </div>
                    </div>
                    ` : ''}
                </div>
            `;

            container.innerHTML = html;
        }

                                        <p style="color: #991b1b; font-size: 13px; font-weight: 600; margin-bottom: 4px;">
                                            ⚠️ ${rootCauses.length} root cause${rootCauses.length > 1 ? 's' : ''} identified
                                        </p>

                                            ${plan.estimated_time ? `<p style="margin-top: 12px; color: var(--gray-600); font-size: 13px;">⏱️ Estimated time: ${plan.estimated_time}</p>` : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : '<p style="color: var(--gray-500); padding: 20px;">No repair plans generated yet.</p>'}
                    </div>
                </div>
            `;
        }

        function renderExecutorStep() {
            return `
                <div class="pipeline-step pending" id="step-executor">
                    <div class="step-header" onclick="toggleStep('executor')">
                        <div class="step-header-left">
                            <div class="step-icon executor">⚙️</div>
                            <div class="step-info">
                                <h3>Step 4: Executor</h3>
                                <div class="step-description">Plan execution and workflow repair</div>
                            </div>
                        </div>
                        <div class="step-status">
                            <span class="status-badge pending">Pending</span>
                            <span class="expand-icon">▼</span>
                        </div>
                    </div>
                    <div class="step-content" id="content-executor">
                        <p style="color: var(--gray-500); padding: 20px;">Executor integration coming soon...</p>
                    </div>
                </div>
            `;
        }

        function toggleStep(stepName) {
            const content = document.getElementById(`content-${stepName}`);
            const icon = document.querySelector(`#step-${stepName} .expand-icon`);

            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                icon.style.transform = 'rotate(0deg)';
            } else {
                content.classList.add('expanded');
                icon.style.transform = 'rotate(180deg)';
            }
        }
    </script>
</body>
</html>
