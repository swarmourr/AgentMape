<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAPE-K Pipeline - Workflow Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: var(--gray-800);
        }

        /* Header */
        .header {
            background: white;
            border-bottom: 1px solid var(--gray-200);
            padding: 24px 40px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            padding: 10px 16px;
            background: white;
            border: 1px solid var(--gray-300);
            border-radius: 8px;
            color: var(--gray-700);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--gray-100);
        }

        .workflow-header-info h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .workflow-id {
            font-family: Monaco, monospace;
            font-size: 13px;
            color: var(--gray-600);
        }

        .refresh-btn {
            padding: 10px 20px;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 40px;
        }

        /* MAPE-K Pipeline Steps */
        .pipeline-steps {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .pipeline-step {
            background: white;
            border-radius: 12px;
            border: 1px solid var(--gray-200);
            overflow: hidden;
            transition: all 0.3s;
        }

        .pipeline-step.completed {
            border-color: var(--success);
        }

        .pipeline-step.error {
            border-color: var(--danger);
        }

        .pipeline-step.in-progress {
            border-color: var(--primary);
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0%, 100% { border-color: var(--primary); }
            50% { border-color: rgba(99, 102, 241, 0.3); }
        }

        .step-header {
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .step-header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .step-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .step-icon.monitor { background: rgba(59, 130, 246, 0.1); }
        .step-icon.analyzer { background: rgba(139, 92, 246, 0.1); }
        .step-icon.planner { background: rgba(16, 185, 129, 0.1); }
        .step-icon.executor { background: rgba(245, 158, 11, 0.1); }

        .step-info h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .step-description {
            font-size: 14px;
            color: var(--gray-500);
        }

        .step-status {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-badge.completed {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .status-badge.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .status-badge.pending {
            background: rgba(148, 163, 184, 0.1);
            color: var(--gray-500);
        }

        .status-badge.in-progress {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
        }

        .expand-icon {
            font-size: 20px;
            transition: transform 0.3s;
        }

        .step-content {
            padding: 0 24px 24px 24px;
            display: none;
        }

        .step-content.expanded {
            display: block;
            animation: slideDown 0.3s;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Output Sections */
        .output-section {
            margin-bottom: 20px;
        }

        .output-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .output-box {
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            padding: 16px;
            font-size: 13px;
        }

        .output-box pre {
            margin: 0;
            font-family: Monaco, monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .key-value-list {
            display: grid;
            gap: 12px;
        }

        .key-value-item {
            display: flex;
            gap: 12px;
        }

        .key-value-key {
            font-weight: 600;
            color: var(--gray-600);
            min-width: 150px;
        }

        .key-value-value {
            color: var(--gray-900);
            font-family: Monaco, monospace;
            font-size: 12px;
        }

        /* Problems List */
        .problems-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .problem-item {
            background: white;
            border: 1px solid var(--gray-200);
            border-left: 4px solid var(--danger);
            border-radius: 8px;
            padding: 16px;
        }

        .problem-title {
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 8px;
        }

        .problem-description {
            color: var(--gray-700);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .problem-solution {
            background: rgba(16, 185, 129, 0.05);
            border-left: 3px solid var(--success);
            padding: 12px;
            border-radius: 6px;
        }

        .solution-label {
            font-weight: 600;
            color: var(--success);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Plans List */
        .plans-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .plan-item {
            background: white;
            border: 1px solid var(--gray-200);
            border-left: 4px solid var(--success);
            border-radius: 8px;
            padding: 16px;
        }

        .plan-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .plan-title {
            font-weight: 600;
            color: var(--gray-900);
        }

        .risk-badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .risk-badge.low { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .risk-badge.medium { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .risk-badge.high { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

        .plan-steps {
            margin-top: 12px;
            padding-left: 20px;
        }

        .plan-steps li {
            margin-bottom: 8px;
            color: var(--gray-700);
        }

        /* Loading/Empty */
        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid var(--gray-200);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <div style="display: flex; align-items: center; gap: 20px;">
                <a href="/" class="back-btn">← Back</a>
                <div class="workflow-header-info">
                    <h1>MAPE-K Pipeline Analysis</h1>
                    <div class="workflow-id" id="workflow-id-display">Loading...</div>
                </div>
            </div>
            <button class="refresh-btn" onclick="loadWorkflowData()">🔄 Refresh</button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <div class="pipeline-steps" id="pipeline-steps">
            <div class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 16px; color: var(--gray-500);">Loading MAPE-K pipeline...</p>
            </div>
        </div>
    </div>

    <script>
        // Get workflow ID from URL
        const workflowId = window.location.pathname.split('/').pop();

        // Load data on page load
        loadWorkflowData();

        // Auto-refresh every 15 seconds
        setInterval(loadWorkflowData, 15000);

        async function loadWorkflowData() {
            try {
                document.getElementById('workflow-id-display').textContent = workflowId;

                const response = await fetch(`/api/workflow/${workflowId}/analysis`);
                const data = await response.json();

                renderPipeline(data);

            } catch (error) {
                console.error('Error loading workflow data:', error);
                document.getElementById('pipeline-steps').innerHTML = `
                    <div style="text-align: center; padding: 40px; color: var(--danger);">
                        <p>Error loading workflow data</p>
                    </div>
                `;
            }
        }

        function renderPipeline(data) {
            const monitor = data.monitor || {};
            const analyzer = data.analyzer || {};
            const planner = data.planner || {};

            const stepsHtml = `
                ${renderMonitorStep(monitor)}
                ${renderAnalyzerStep(analyzer)}
                ${renderPlannerStep(planner)}
                ${renderExecutorStep()}
            `;

            document.getElementById('pipeline-steps').innerHTML = stepsHtml;
        }

        function renderMonitorStep(monitor) {
            const hasData = monitor.status === 'success';
            const metadata = monitor.metadata || {};

            return `
                <div class="pipeline-step ${hasData ? 'completed' : 'pending'}" id="step-monitor">
                    <div class="step-header" onclick="toggleStep('monitor')">
                        <div class="step-header-left">
                            <div class="step-icon monitor">📡</div>
                            <div class="step-info">
                                <h3>Step 1: Monitor</h3>
                                <div class="step-description">Workflow detection and metadata collection</div>
                            </div>
                        </div>
                        <div class="step-status">
                            <span class="status-badge ${hasData ? 'completed' : 'pending'}">
                                ${hasData ? '✓ Completed' : 'Pending'}
                            </span>
                            <span class="expand-icon">▼</span>
                        </div>
                    </div>
                    <div class="step-content" id="content-monitor">
                        ${hasData ? `
                            <div class="output-section">
                                <div class="output-title">📂 Workflow Metadata Collected</div>
                                <div class="key-value-list">
                                    <div class="key-value-item">
                                        <span class="key-value-key">Workflow Directory:</span>
                                        <span class="key-value-value">${metadata.iwd || 'N/A'}</span>
                                    </div>
                                    <div class="key-value-item">
                                        <span class="key-value-key">Workflow YAML:</span>
                                        <span class="key-value-value">${metadata.workflow_yaml_path || 'N/A'}</span>
                                    </div>
                                    <div class="key-value-item">
                                        <span class="key-value-key">Collection Time:</span>
                                        <span class="key-value-value">${metadata.collected_at ? new Date(metadata.collected_at).toLocaleString() : 'N/A'}</span>
                                    </div>
                                    <div class="key-value-item">
                                        <span class="key-value-key">State:</span>
                                        <span class="key-value-value">${monitor.state || 'Unknown'}</span>
                                    </div>
                                </div>
                            </div>

                            ${metadata.execution_site ? `
                                <div class="output-section">
                                    <div class="output-title">🖥️  Execution Site Information</div>
                                    <div class="key-value-list">
                                        ${metadata.execution_site.submit_hostname ? `
                                            <div class="key-value-item">
                                                <span class="key-value-key">Submit Host:</span>
                                                <span class="key-value-value">${metadata.execution_site.submit_hostname}</span>
                                            </div>
                                        ` : ''}
                                        ${metadata.execution_site.submit_user ? `
                                            <div class="key-value-item">
                                                <span class="key-value-key">Submit User:</span>
                                                <span class="key-value-value">${metadata.execution_site.submit_user}</span>
                                            </div>
                                        ` : ''}
                                        ${metadata.execution_site.monitor_hostname ? `
                                            <div class="key-value-item">
                                                <span class="key-value-key">Monitor Host:</span>
                                                <span class="key-value-value">${metadata.execution_site.monitor_hostname}</span>
                                            </div>
                                        ` : ''}
                                        ${metadata.execution_site.planner ? `
                                            <div class="key-value-item">
                                                <span class="key-value-key">Planner:</span>
                                                <span class="key-value-value">${metadata.execution_site.planner}${metadata.execution_site.planner_version ? ' v' + metadata.execution_site.planner_version : ''}</span>
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                            ` : ''}

                            ${metadata.transformation_pfns && metadata.transformation_pfns.length > 0 ? `
                                <div class="output-section">
                                    <div class="output-title">📄 Transformation Scripts (${metadata.transformation_pfns.length})</div>
                                    <div class="output-box">
                                        <pre>${metadata.transformation_pfns.map((t, i) => `${i+1}. ${t.name || 'Unknown'}\n   Path: ${t.pfn || 'N/A'}`).join('\n\n')}</pre>
                                    </div>
                                </div>
                            ` : ''}

                            ${metadata.replica_pfns && metadata.replica_pfns.length > 0 ? `
                                <div class="output-section">
                                    <div class="output-title">📦 Replica Files (${metadata.replica_pfns.length})</div>
                                    <div class="output-box">
                                        <pre>${metadata.replica_pfns.map((r, i) => `${i+1}. ${r.lfn || 'Unknown'}\n   Path: ${r.pfn || 'N/A'}`).join('\n\n')}</pre>
                                    </div>
                                </div>
                            ` : ''}
                        ` : '<p style="color: var(--gray-500); padding: 20px;">No monitoring data available yet.</p>'}
                    </div>
                </div>
            `;
        }

        function renderAnalyzerStep(analyzer) {
            const hasData = analyzer.status === 'success';
            const problems = analyzer.problems || [];
            const logs = analyzer.logs || '';

            return `
                <div class="pipeline-step ${hasData ? 'completed' : analyzer.error ? 'error' : 'pending'}" id="step-analyzer">
                    <div class="step-header" onclick="toggleStep('analyzer')">
                        <div class="step-header-left">
                            <div class="step-icon analyzer">🔬</div>
                            <div class="step-info">
                                <h3>Step 2: Analyzer</h3>
                                <div class="step-description">Root cause analysis and problem detection</div>
                            </div>
                        </div>
                        <div class="step-status">
                            <span class="status-badge ${hasData ? 'completed' : analyzer.error ? 'error' : 'pending'}">
                                ${hasData ? '✓ Completed' : analyzer.error ? '✗ Error' : 'Pending'}
                            </span>
                            <span class="expand-icon">▼</span>
                        </div>
                    </div>
                    <div class="step-content" id="content-analyzer">
                        ${hasData ? `
                            ${problems.length > 0 ? `
                                <div class="output-section">
                                    <div class="output-title">⚠️ Problems Detected (${problems.length})</div>
                                    <div class="problems-list">
                                        ${problems.map((p, i) => `
                                            <div class="problem-item">
                                                <div class="problem-title">Problem ${i+1}: ${p.problem || 'Unknown'}</div>
                                                <div class="problem-description">${p.description || 'No description'}</div>
                                                ${p.solution ? `
                                                    <div class="problem-solution">
                                                        <div class="solution-label">💡 Recommended Solution</div>
                                                        <div>${p.solution}</div>
                                                    </div>
                                                ` : ''}
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            ` : '<p style="color: var(--success); padding: 20px;">✅ No problems detected!</p>'}

                            ${logs ? `
                                <div class="output-section">
                                    <div class="output-title">📜 Pegasus Analyzer Output</div>
                                    <div class="output-box">
                                        <pre>${logs.substring(0, 2000)}${logs.length > 2000 ? '\n... (truncated)' : ''}</pre>
                                    </div>
                                </div>
                            ` : ''}
                        ` : analyzer.error ? `
                            <p style="color: var(--danger); padding: 20px;">Error: ${analyzer.error}</p>
                        ` : '<p style="color: var(--gray-500); padding: 20px;">Waiting for analysis...</p>'}
                    </div>
                </div>
            `;
        }

        function renderPlannerStep(planner) {
            const hasData = planner.status === 'success';
            const plans = planner.plans || [];

            return `
                <div class="pipeline-step ${hasData && plans.length > 0 ? 'completed' : 'pending'}" id="step-planner">
                    <div class="step-header" onclick="toggleStep('planner')">
                        <div class="step-header-left">
                            <div class="step-icon planner">📋</div>
                            <div class="step-info">
                                <h3>Step 3: Planner</h3>
                                <div class="step-description">Repair plan generation and strategy selection</div>
                            </div>
                        </div>
                        <div class="step-status">
                            <span class="status-badge ${hasData && plans.length > 0 ? 'completed' : 'pending'}">
                                ${hasData && plans.length > 0 ? '✓ Completed' : 'Pending'}
                            </span>
                            <span class="expand-icon">▼</span>
                        </div>
                    </div>
                    <div class="step-content" id="content-planner">
                        ${hasData && plans.length > 0 ? `
                            <div class="output-section">
                                <div class="output-title">🛠️ Repair Plans Generated (${plans.length})</div>
                                <div class="plans-list">
                                    ${plans.map((plan, i) => `
                                        <div class="plan-item">
                                            <div class="plan-header">
                                                <div class="plan-title">Plan ${i+1}: ${plan.description || 'Repair Plan'}</div>
                                                <span class="risk-badge ${(plan.risk_level || 'medium').toLowerCase()}">${plan.risk_level || 'medium'} risk</span>
                                            </div>
                                            ${plan.repair_steps && plan.repair_steps.length > 0 ? `
                                                <div class="plan-steps">
                                                    <ol>
                                                        ${plan.repair_steps.map(step => `<li>${step.action || step.description || step}</li>`).join('')}
                                                    </ol>
                                                </div>
                                            ` : ''}
                                            ${plan.estimated_time ? `<p style="margin-top: 12px; color: var(--gray-600); font-size: 13px;">⏱️ Estimated time: ${plan.estimated_time}</p>` : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : '<p style="color: var(--gray-500); padding: 20px;">No repair plans generated yet.</p>'}
                    </div>
                </div>
            `;
        }

        function renderExecutorStep() {
            return `
                <div class="pipeline-step pending" id="step-executor">
                    <div class="step-header" onclick="toggleStep('executor')">
                        <div class="step-header-left">
                            <div class="step-icon executor">⚙️</div>
                            <div class="step-info">
                                <h3>Step 4: Executor</h3>
                                <div class="step-description">Plan execution and workflow repair</div>
                            </div>
                        </div>
                        <div class="step-status">
                            <span class="status-badge pending">Pending</span>
                            <span class="expand-icon">▼</span>
                        </div>
                    </div>
                    <div class="step-content" id="content-executor">
                        <p style="color: var(--gray-500); padding: 20px;">Executor integration coming soon...</p>
                    </div>
                </div>
            `;
        }

        function toggleStep(stepName) {
            const content = document.getElementById(`content-${stepName}`);
            const icon = document.querySelector(`#step-${stepName} .expand-icon`);

            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                icon.style.transform = 'rotate(0deg)';
            } else {
                content.classList.add('expanded');
                icon.style.transform = 'rotate(180deg)';
            }
        }
    </script>
</body>
</html>
