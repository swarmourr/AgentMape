version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pegasus_remediation
      POSTGRES_USER: pegasus
      POSTGRES_PASSWORD: pegasus_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pegasus -d pegasus_remediation"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: pegasus
      RABBITMQ_DEFAULT_PASS: pegasus_secret
      RABBITMQ_DEFAULT_VHOST: pegasus
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://pegasus:pegasus_secret@postgres:5432/pegasus_remediation
      AMQP_URL: amqp://pegasus:pegasus_secret@rabbitmq:5672/pegasus
      REDIS_URL: redis://redis:6379/0

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
