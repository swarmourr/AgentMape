# MAPE-K System Nginx Reverse Proxy Configuration
# This exposes all services through ONE port (8000) for single ngrok tunnel
# No CORS issues - all services on same domain!

events {
    worker_connections 1024;
}

http {
    # Logging
    access_log /tmp/nginx_mapek_access.log;
    error_log /tmp/nginx_mapek_error.log;

    # Timeouts for long-running requests
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    send_timeout 300;

    # Buffer settings
    proxy_buffering off;
    proxy_request_buffering off;

    server {
        listen 8000;
        server_name localhost;

        # Disable buffering for SSE/streaming
        proxy_buffering off;
        proxy_cache off;

        # Dashboard (Frontend) - Must be last to catch all other routes
        location / {
            proxy_pass http://localhost:8085;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Dashboard static files
        location /static/ {
            proxy_pass http://localhost:8085/static/;
            proxy_set_header Host $host;
        }

        # Dashboard API (its own endpoints)
        location /api/workflow/ {
            proxy_pass http://localhost:8085/api/workflow/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Monitor API - rewrite /api/monitor/* to /api/*
        location /api/monitor/ {
            rewrite ^/api/monitor/(.*) /api/$1 break;
            proxy_pass http://localhost:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Pegasus Provider API - rewrite /api/pegasus/* to /api/*
        location /api/pegasus/ {
            rewrite ^/api/pegasus/(.*) /api/$1 break;
            proxy_pass http://localhost:8084;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Analyzer API (if needed directly)
        location /api/analyzer/ {
            rewrite ^/api/analyzer/(.*) /api/$1 break;
            proxy_pass http://localhost:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Planner API (if needed directly)
        location /api/planner/ {
            rewrite ^/api/planner/(.*) /api/$1 break;
            proxy_pass http://localhost:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Executor API (if needed directly)
        location /api/executor/ {
            rewrite ^/api/executor/(.*) /api/$1 break;
            proxy_pass http://localhost:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check endpoint
        location /nginx-health {
            return 200 "Nginx OK\n";
            add_header Content-Type text/plain;
        }
    }
}
